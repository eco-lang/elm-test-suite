# Runs the suite under every compiler on Linux, builds the results website (site/, elm-pages) and
# publishes it to Netlify. Runs on master deploy to production; a pull request gets a draft deploy
# when the Netlify secrets are available (not for pull requests from forks). Runs on the staging
# branch, standard-elm-suite, deploy to a separate staging site. The site is also kept as a workflow
# artifact either way.
#
# Netlify setup: create a site (no build settings needed: CI uploads the built files), then add the
# repository secrets NETLIFY_AUTH_TOKEN (a personal access token) and NETLIFY_SITE_ID (the site's
# API ID). For the staging site, create another site and add NETLIFY_AUTH_TOKEN_STAGING and
# NETLIFY_SITE_ID_STAGING. Without a site's secrets every step but its deploy runs; the staging
# branch never falls back to the production site's secrets.
name: CI

on:
  push:
    branches: [master, standard-elm-suite]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    env:
      # The staging branch deploys to the staging site with its own secrets; everything else uses
      # the production site's. A missing staging secret leaves the value empty, so the deploy is
      # skipped rather than going to the production site.
      STAGING: ${{ github.ref == 'refs/heads/standard-elm-suite' }}
      NETLIFY_AUTH_TOKEN: ${{ github.ref == 'refs/heads/standard-elm-suite' && secrets.NETLIFY_AUTH_TOKEN_STAGING || (github.ref != 'refs/heads/standard-elm-suite' && secrets.NETLIFY_AUTH_TOKEN || '') }}
      NETLIFY_SITE_ID: ${{ github.ref == 'refs/heads/standard-elm-suite' && secrets.NETLIFY_SITE_ID_STAGING || (github.ref != 'refs/heads/standard-elm-suite' && secrets.NETLIFY_SITE_ID || '') }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Each compiler's Elm package cache (ELM_HOME) and the site's.
      - uses: actions/cache@v4
        with:
          path: |
            .work/*/elm-home
            ~/.elm
          key: elm-home-${{ hashFiles('tests/*/elm.json', 'package.json', 'site/elm.json') }}
          restore-keys: elm-home-

      - name: Install the compilers
        run: pnpm install --frozen-lockfile

      # run-all.js exits 0 whatever the tests' outcomes; the baseline check at the end decides.
      - name: Run the suite under every compiler
        run: pnpm test:all 2>&1 | tee test-output.txt

      - name: Write the comparison report to the job summary
        if: always()
        run: test -f .work/report.md && cat .work/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            .work/results/
            .work/report.md
            test-output.txt
          if-no-files-found: ignore

      - name: Write the site data
        run: node runner/site-data.js

      # The Definition of Standard Elm, from its LaTeX sources under definition/.
      - name: Write the site data for the Definition
        run: node runner/definition-data.js

      - name: Build the site
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # The site's own Elm unit tests (site/tests/): the keys and links of its GitHub Discussions.
      - name: Test the site
        working-directory: site
        run: npm test

      - name: Keep the site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist/

      # A run on master (a push or a manual run) deploys to production; a run on the staging branch
      # deploys to the staging site's production URL; a pull request gets a draft deploy at its own
      # URL.
      - name: Deploy to Netlify
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: site/dist
          production-branch: master
          production-deploy: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || env.STAGING == 'true') }}
          alias: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || '' }}
          deploy-message: ${{ github.event.head_commit.message || github.event.pull_request.title || github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pull-request-comment: true
          enable-commit-comment: false
          enable-github-deployment: false

      # elm-bugs and elm-bug-fixes fail under Elm 0.19.1 by design; anything else failing is a
      # regression in the suite or the runner. It runs even when a step above failed (a deploy).
      - name: Check Elm 0.19.1 passes every test it should
        if: always()
        run: node runner/check-baseline.js
